  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"82c2400e-7fba-4dd2-8047-e041bf6f6b1f\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<script src=\"420322c2-0991-4f19-a12e-39879429f913\"><\u002Fscript>\n<script src=\"e4bee313-daad-40f6-95f1-fae61e8d632c\"><\u002Fscript>\n<style>\nhtml,body{margin:0}\nbody{background:var(--surface);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\na{color:var(--text);text-decoration:none}\na:hover{color:var(--text-secondary)}\nem{font-family:var(--font-serif);font-style:italic}\n:root{--accent-warm:#C9964E}\n@media (max-width:720px){\n  .h1{font-size:40px !important}\n  .h2{font-size:28px !important}\n  .h1,.h2{white-space:normal !important}\n  .band{padding:64px 0 !important}\n  nav > div > a{display:none !important}\n  #request > div{grid-template-columns:minmax(0,1fr) !important;gap:48px !important}\n  .stats-grid{grid-template-columns:minmax(0,1fr) !important}\n  .collab-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}\n  .values-grid{grid-template-columns:minmax(0,1fr) !important;gap:56px !important}\n  .inside-grid{grid-template-columns:minmax(0,1fr) !important}\n  .photo-strip{grid-auto-columns:78% !important}\n}\n.h1{max-width:none !important}\n.h2{white-space:nowrap !important;max-width:none !important}\n.idx{display:flex;align-items:baseline;gap:14px;margin:0 0 28px}\n.collab-grid image-slot::part(frame){background:transparent}\n.collab-grid image-slot::part(ring){display:none}\n.idx .no{display:none}\n.idx .rule{display:none}\n.idx .lbl{font-size:18px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-tertiary)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:sticky;top:0;z-index:20;background:var(--surface)\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<x-import component-from-global-scope=\"ArtificeDesignSystem_d02b85.Navbar\" brand=\"Artifice\" links=\"{{ navLinks }}\" on-navigate=\"{{ onNavigate }}\" action=\"{{ navButton }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"hero\" style=\"position:relative;min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;background:#141613\">\n<div style=\"position:absolute;inset:0;z-index:0\">\n<image-slot id=\"hero-bg\" shape=\"rect\" fit=\"cover\" src=\"27984117-839c-42c4-816f-fa45bf5e950a\" placeholder=\"Candlelit room · warm shadows · no saturation boost\"><\u002Fimage-slot>\n<\u002Fdiv>\n<div style=\"position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 92% at 50% 48%, rgba(16,18,15,0.62) 0%, rgba(16,18,15,0.62) 28%, rgba(16,18,15,0.76) 55%, rgba(16,18,15,0.9) 80%, #101210 100%)\"><\u002Fdiv>\n<div style=\"position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(920px,94%);height:74%;z-index:1;pointer-events:none;background:radial-gradient(58% 52% at 50% 50%, rgba(12,14,11,0.82) 0%, rgba(12,14,11,0.6) 42%, rgba(12,14,11,0.2) 74%, rgba(12,14,11,0) 100%);filter:blur(18px)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom, rgba(20,22,19,0.72) 0%, rgba(20,22,19,0) 24%, rgba(20,22,19,0) 60%, rgba(20,22,19,0.9) 100%)\"><\u002Fdiv>\n<div style=\"position:relative;z-index:2;width:100%;max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px);display:flex;flex-direction:column;align-items:center;text-align:center\">\n<span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #141613; padding: 7px 16px; border-radius: 999px; margin: 0 0 28px; background-color: var(--color-mint-porcelain)\">Members only<\u002Fspan>\n<p style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 26px\">An invitation-only circle for art collectors<\u002Fp>\n<h1 class=\"h1\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h1,84px);line-height:1.04;letter-spacing:-0.02em;margin:0;text-wrap:pretty\">You've Always Had The Eye. <br>Now You Have The Room<em>.<\u002Fem><\u002Fh1>\n<p style=\"font-size:17px;line-height:1.7;color:var(--text-secondary);max-width:52ch;margin:30px 0 44px\">A private circle where collectors meet the artists who will define their generation, over private gatherings and viewings.<\u002Fp>\n<div style=\"display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap\">\n<a href=\"{{ formUrl }}\" style=\"display: inline-flex; align-items: center; font-family: var(--font-sans); font-weight: 500; font-size: 14px; letter-spacing: 0.02em; color: #141613; padding: 15px 30px; border-radius: 4px; background-color: var(--color-mint-porcelain)\" target=\"_blank\" rel=\"noopener\">Become a Founding Member<\u002Fa>\n<a href=\"#idea\" style=\"font-size:14px;color:var(--text);border-bottom:1px solid rgba(244,248,243,0.4);padding-bottom:3px\">See what happens inside →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:0;z-index:2;border-top:1px solid rgba(244,248,243,0.12)\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:18px var(--gutter,40px);display:flex;justify-content:center;flex-wrap:wrap;gap:10px 28px;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-tertiary)\">\n<sc-for list=\"{{ cities }}\" as=\"city\" hint-placeholder-count=\"7\"><span>{{ city }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section id=\"collab\" class=\"band\" style=\"border-top: 1px solid var(--border); padding: calc(var(--band-pad,104px) * 0.5) 0; height: 200px\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<p style=\"text-align:center;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 40px\">We have collaborated with<\u002Fp>\n<div class=\"collab-grid\" style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:40px\">\n<sc-for list=\"{{ logos }}\" as=\"logo\" hint-placeholder-count=\"5\">\n<div style=\"height:88px;display:flex;align-items:center;justify-content:center;padding:8px\">\n<image-slot id=\"{{ logo.id }}\" shape=\"rect\" fit=\"contain\" style=\"color:#fff\" placeholder=\"{{ logo.caption }}\"><\u002Fimage-slot>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"figures\" class=\"band\" style=\"border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:calc(var(--band-pad,104px) * 0.7) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<div class=\"idx\"><span class=\"no\">No. 00<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">The room, so far<\u002Fspan><\u002Fdiv>\n<div class=\"stats-grid\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px\">\n<sc-for list=\"{{ stats }}\" as=\"stat\" hint-placeholder-count=\"3\">\n<div style=\"border-top:1px solid var(--border-strong);padding-top:24px\">\n<p style=\"font-family:var(--font-serif);font-weight:400;font-size:clamp(56px,7vw,88px);line-height:0.95;letter-spacing:-0.03em;margin:0\">{{ stat.display }}<\u002Fp>\n<p style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-tertiary);margin:20px 0 0;max-width:28ch\">{{ stat.label }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"values\" class=\"band\" style=\"padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<div class=\"idx\"><span class=\"no\">No. 01<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">What holds the room<\u002Fspan><\u002Fdiv>\n<div class=\"values-grid\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px\">\n<sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"3\">\n<div>\n<div style=\"margin-bottom:28px\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:var(--text)\"><use href=\"6a490f55-32d3-4e18-bf81-9a842d5abae8#{{ v.icon }}\"><\u002Fuse><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"font-family:var(--font-serif);font-weight:400;font-size:30px;letter-spacing:-0.01em;margin:0 0 14px\">{{ v.title }}<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.7;color:var(--text-secondary);margin:0\">{{ v.body }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"idea\" class=\"band\" style=\"background:var(--surface-3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px);display:grid;grid-template-columns:minmax(0,1fr);gap:32px\">\n<div class=\"idx\"><span class=\"no\">No. 02<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">What Artifice is<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0;max-width:18ch\">The room is small. <em>On purpose.<\u002Fem><\u002Fh2>\n<p style=\"font-size:var(--body,17px);line-height:var(--body-lh,1.75);color:var(--text-secondary);max-width:var(--measure,64ch);margin:0\">An invitation-only circle of serious collectors. You meet the artists who'll define this generation before the market does. Not a mailing list. A room worth being in.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"belief\" class=\"band\" style=\"padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px);display:grid;grid-template-columns:minmax(0,1fr);gap:32px\">\n<div class=\"idx\"><span class=\"no\">No. 03<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">The belief<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0;max-width:18ch\">The art world runs on <em>who you know.<\u002Fem><\u002Fh2>\n<p style=\"font-size:var(--body,17px);line-height:var(--body-lh,1.75);color:var(--text-secondary);max-width:var(--measure,64ch);margin:0\">The artists you'll wish you'd found early are showing their work right now, in rooms you're not in. That's how the art world has always moved: quietly, early, among the connected. Artifice changes who's connected.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"evening\" class=\"band\" style=\"background:var(--surface-3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px);display:grid;grid-template-columns:minmax(0,1fr);gap:32px\">\n<div class=\"idx\"><span class=\"no\">No. 04<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">The first evening<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0;max-width:18ch\">It begins with <em>one room.<\u002Fem><\u002Fh2>\n<p style=\"font-size:var(--body,17px);line-height:var(--body-lh,1.75);color:var(--text-secondary);max-width:var(--measure,64ch);margin:0\">The first evening is a gathering. A small group of collectors and the artists we believe in most, in one room. No stage. No pitch. Everyone in it chosen.<\u002Fp>\n<div style=\"margin-top:24px;max-width:560px\">\n<x-import component-from-global-scope=\"ArtificeDesignSystem_d02b85.Card\" raised=\"{{ true }}\" eyebrow=\"A private evening\" title=\"Details to come\" meta=\"Limited places\" footer=\"{{ cardButton }}\" hint-size=\"100%,240px\">The date and the address go to the room first. Request an invitation to be among them.<\u002Fx-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showInside }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"inside\" class=\"band\" style=\"padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<div class=\"idx\"><span class=\"no\">No. 05<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">Inside the circle<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 56px;max-width:18ch\">What the room <em>gives you.<\u002Fem><\u002Fh2>\n<div class=\"inside-grid\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border)\">\n<sc-for list=\"{{ inside }}\" as=\"cell\" hint-placeholder-count=\"4\">\n<div style=\"background:var(--surface);padding:40px;display:flex;flex-direction:column;gap:24px;min-height:320px\">\n<div style=\"aspect-ratio:16/9;position:relative\">\n<image-slot id=\"{{ cell.id }}\" shape=\"rounded\" radius=\"4\" placeholder=\"{{ cell.caption }}\"><\u002Fimage-slot>\n<\u002Fdiv>\n<div>\n<h3 style=\"font-family:var(--font-serif);font-weight:400;font-size:26px;letter-spacing:-0.01em;margin:0 0 12px\">{{ cell.title }}<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.7;color:var(--text-secondary);margin:0;max-width:40ch\">{{ cell.body }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showRoom }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"room\" class=\"band\" style=\"background:var(--surface-3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--band-pad,104px) 0;overflow:hidden\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto 48px;padding:0 var(--gutter,40px)\">\n<div class=\"idx\"><span class=\"no\">No. 06<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">The room · relived<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0;max-width:18ch\">Who was in the <em>room.<\u002Fem><\u002Fh2>\n<\u002Fdiv>\n<div class=\"photo-strip\" style=\"display:grid;grid-auto-flow:column;grid-auto-columns:min(38%,520px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--gutter,40px) 8px;-webkit-overflow-scrolling:touch\">\n<sc-for list=\"{{ roomPhotos }}\" as=\"photo\" hint-placeholder-count=\"4\">\n<div style=\"scroll-snap-align:start;aspect-ratio:4/5;position:relative\">\n<image-slot id=\"{{ photo.id }}\" shape=\"rounded\" radius=\"4\" placeholder=\"{{ photo.caption }}\"><\u002Fimage-slot>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"max-width:var(--content-max,1400px);margin:12px auto 0;padding:0 var(--gutter,40px)\">\n<p style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-tertiary);margin:0\">Scroll the evening →&nbsp;&nbsp;Candlelight only · warm shadows · no saturation boost<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"voice\" class=\"band\" style=\"padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<div class=\"idx\"><span class=\"no\">No. 07<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">From the room<\u002Fspan><\u002Fdiv>\n<blockquote style=\"font-family:var(--font-serif);font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.28;letter-spacing:-0.01em;margin:0;max-width:22ch\">I met the artist whose work now hangs in my hall. <em>In this room, before the market did.<\u002Fem><\u002Fblockquote>\n<div style=\"display:flex;align-items:center;gap:16px;margin-top:40px\">\n<div style=\"width:44px;height:44px;flex:none;border-radius:999px;overflow:hidden;position:relative\">\n<image-slot id=\"voice-avatar\" shape=\"circle\" placeholder=\"Portrait\"><\u002Fimage-slot>\n<\u002Fdiv>\n<p style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-tertiary);margin:0\">A founding collector · New York<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showFaq }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"faq\" class=\"band\" style=\"padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<div class=\"idx\"><span class=\"no\">No. 08<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">Frequently asked<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 56px\">Questions, <em>answered.<\u002Fem><\u002Fh2>\n<div style=\"border-top:1px solid var(--border-strong)\">\n<sc-for list=\"{{ faq }}\" as=\"row\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom:1px solid var(--border)\">\n<button type=\"button\" sc-camel-on-click=\"{{ row.toggle }}\" style=\"width:100%;background:none;border:none;padding:28px 0;display:flex;align-items:center;justify-content:space-between;gap:32px;cursor:pointer;text-align:left;color:var(--text);font-family:var(--font-serif);font-size:24px;letter-spacing:-0.01em;transition:var(--transition-color)\">\n<span>{{ row.question }}<\u002Fspan>\n<span style=\"font-family:var(--font-sans);font-size:20px;color:var(--text-tertiary);flex:none;line-height:1\">{{ row.sign }}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ row.open }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"font-size:16px;line-height:1.75;color:var(--text-secondary);max-width:64ch;margin:0 0 28px\">{{ row.answer }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"founding\" class=\"band\" style=\"background:var(--surface-3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--band-pad,104px) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px);display:grid;grid-template-columns:minmax(0,1fr);gap:32px\">\n<div class=\"idx\"><span class=\"no\">No. 09<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">Founding members<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0;max-width:18ch\">Be early to the room, <em>not just the art.<\u002Fem><\u002Fh2>\n<p style=\"font-size:var(--body,17px);line-height:var(--body-lh,1.75);color:var(--text-secondary);max-width:var(--measure,64ch);margin:0\">Artifice opens with a founding circle: the collectors who join before the room is full. They set its tone and shape who comes next. Membership closes as the room fills. For now, the door is open.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"request\" class=\"band\" style=\"border-top:1px solid var(--border);padding:calc(var(--band-pad,104px) * 1.3) 0\">\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:32px\">\n<div class=\"idx\" style=\"justify-content:center\"><span class=\"no\">No. 10<\u002Fspan><span class=\"rule\"><\u002Fspan><span class=\"lbl\">Request an invitation<\u002Fspan><\u002Fdiv>\n<h2 class=\"h2\" style=\"font-family:var(--font-serif);font-weight:400;font-size:var(--h2,52px);line-height:1.1;letter-spacing:-0.02em;margin:0\">Request an invitation.<\u002Fh2>\n<p style=\"font-size:var(--body,17px);line-height:var(--body-lh,1.75);color:var(--text-secondary);max-width:52ch;margin:0\">Tell us who you are and what brings you. If Artifice is right for you, we'll write back.<\u002Fp>\n<div style=\"margin-top:8px\">\n<a href=\"{{ formUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;font-family:var(--font-sans);font-weight:500;font-size:15px;letter-spacing:0.02em;color:var(--on-accent);background:var(--accent);padding:16px 34px;border-radius:var(--radius-md,4px)\">Become a Founding Member<\u002Fa>\n<\u002Fdiv>\n<p style=\"font-size:12px;color:var(--text-tertiary);margin:0\">Your details stay between us. No lists, no sharing.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:var(--content-max,1400px);margin:0 auto;padding:0 var(--gutter,40px)\">\n<x-import component-from-global-scope=\"ArtificeDesignSystem_d02b85.Footer\" brand=\"Artifice\" line=\"An invitation-only circle for art collectors.\" columns=\"{{ footerColumns }}\" hint-size=\"100%,200px\"><\u002Fx-import>\n<div style=\"height:48px\"><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;formUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;showInside&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showRoom&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showFaq&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;statCollectors&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:0,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Figures&quot;},&quot;statArtists&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;min&quot;:0,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Figures&quot;},&quot;statEvenings&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;min&quot;:0,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Figures&quot;},&quot;contentWidth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1400,&quot;min&quot;:900,&quot;max&quot;:2200,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;gutter&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:40,&quot;min&quot;:16,&quot;max&quot;:160,&quot;step&quot;:4,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;sectionSpacing&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:104,&quot;min&quot;:48,&quot;max&quot;:240,&quot;step&quot;:8,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;measure&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:90,&quot;min&quot;:36,&quot;max&quot;:140,&quot;step&quot;:2,&quot;unit&quot;:&quot;ch&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;heroSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:84,&quot;min&quot;:48,&quot;max&quot;:180,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Type&quot;},&quot;headlineSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:52,&quot;min&quot;:32,&quot;max&quot;:120,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Type&quot;},&quot;bodySize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:17,&quot;min&quot;:14,&quot;max&quot;:26,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Type&quot;},&quot;bodyLineHeight&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.75,&quot;min&quot;:1.3,&quot;max&quot;:2.2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Type&quot;},&quot;faqSingleOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: 0, name: '', email: '', who: '', brings: '', note: '', touched: false, sent: false, statT: 0 };\n\n  componentDidMount() {\n    this.applyTokens();\n    this._fit = () => this.fitHero();\n    window.addEventListener('resize', this._fit);\n    this.fitHero();\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.fitHero());\n    const el = document.getElementById('figures');\n    const run = () => {\n      if (this._ran) return; this._ran = true;\n      const start = performance.now(), dur = 1400;\n      const tick = (now) => {\n        const p = Math.min(1, (now - start) / dur);\n        const e = 1 - Math.pow(1 - p, 3);\n        this.setState({ statT: e });\n        if (p < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    };\n    if (el && 'IntersectionObserver' in window) {\n      const io = new IntersectionObserver((ents) => {\n        ents.forEach(en => { if (en.isIntersecting) { run(); io.disconnect(); } });\n      }, { threshold: 0.4 });\n      io.observe(el);\n    } else { run(); }\n  }\n  componentDidUpdate() { this.applyTokens(); this.fitHero(); }\n  componentWillUnmount() { if (this._fit) window.removeEventListener('resize', this._fit); }\n\n  fitHero() {\n    const h = document.querySelector('#hero .h1');\n    if (!h || !h.parentElement) return;\n    if (window.innerWidth <= 720) {\n      h.style.removeProperty('white-space');\n      h.style.removeProperty('font-size');\n      return;\n    }\n    const cont = h.parentElement;\n    const cs = getComputedStyle(cont);\n    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);\n    const avail = cont.clientWidth - pad;\n    if (avail <= 0) return;\n    h.style.setProperty('white-space', 'nowrap', 'important');\n    h.style.setProperty('font-size', '100px', 'important');\n    const w100 = h.scrollWidth;\n    if (!w100) return;\n    const cap = this.props.heroSize ?? 84;\n    const size = Math.max(28, Math.min(cap, 100 * avail / w100));\n    h.style.setProperty('font-size', size + 'px', 'important');\n  }\n\n  applyTokens() {\n    const p = this.props;\n    const r = document.documentElement;\n    r.setAttribute('data-theme', (p.theme || 'dark') === 'light' ? 'light' : 'dark');\n    const set = (k, v) => r.style.setProperty(k, v);\n    set('--content-max', (p.contentWidth ?? 1400) + 'px');\n    set('--gutter', (p.gutter ?? 40) + 'px');\n    set('--band-pad', (p.sectionSpacing ?? 104) + 'px');\n    set('--measure', (p.measure ?? 90) + 'ch');\n    set('--h1', (p.heroSize ?? 84) + 'px');\n    set('--h2', (p.headlineSize ?? 52) + 'px');\n    set('--body', (p.bodySize ?? 17) + 'px');\n    set('--body-lh', String(p.bodyLineHeight ?? 1.75));\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' });\n  }\n\n  submit() {\n    const s = this.state;\n    const ok = s.name.trim() && /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.email.trim()) && s.who && s.brings;\n    this.setState({ touched: true });\n    if (ok) this.setState({ sent: true });\n  }\n\n  renderVals() {\n    const NS = window.ArtificeDesignSystem_d02b85 || {};\n    const s = this.state;\n    const t = s.touched;\n    const faqData = [\n      ['How do I get into Artifice?', \"By invitation, or by request. Most members are introduced by someone already in the room. If no one has brought you yet, request an invitation below and tell us what you collect. We read every one.\"],\n      ['Who is Artifice for?', \"Serious collectors who have the eye and want in the room earlier. You don't need a famous name or a museum-sized collection. You need real taste and the intent to build.\"],\n      ['Do I have to buy anything?', \"No. Artifice is a circle, not a sales floor. You'll meet artists and see work, but nothing is for sale unless you want it to be. No pressure, no pitch.\"],\n      ['Is my collecting private?', \"Yes. What you own, what you're looking at, and what you buy stays between you and the room. We don't publish members or share your name without your say.\"],\n      ['Where does Artifice operate?', \"We're just beginning, so the map is still being drawn. We gather where our collectors are. Request an invitation, tell us where you are, and we'll keep you close to the next evening.\"],\n    ];\n    const single = this.props.faqSingleOpen ?? true;\n    const p = this.props;\n    const formUrl = p.formUrl || 'https://tally.so/r/vGpo1A';\n    const toForm = () => window.open(formUrl, '_blank', 'noopener');\n    const statDefs = [\n      { value: p.statCollectors ?? 20, suffix: '+', label: 'Events Held' },\n      { value: p.statArtists ?? 200, suffix: '+', label: 'People through the door' },\n      { value: p.statEvenings ?? 100, suffix: '%', label: 'By invitation only' },\n    ];\n    const stats = statDefs.map(d => ({\n      display: Math.round(d.value * s.statT) + d.suffix,\n      label: d.label,\n    }));\n    const values = [\n      { id: 'val-1', icon: 'i-user', title: 'Chosen', caption: 'A face in candlelight', body: \"Who is in the room decides everything that follows. Seats are not filled. They are chosen, one by one.\" },\n      { id: 'val-2', icon: 'i-clock', title: 'Early', caption: 'Work, before the wall label', body: \"You meet the artists who will define this generation before the market names its price. Early is the whole advantage.\" },\n      { id: 'val-3', icon: 'i-candle', title: 'Private', caption: 'A quiet corner, two in conversation', body: \"What you collect and who you meet stays in the room. No lists, no press, no names shared without your say.\" },\n    ];\n    const inside = [\n      { id: 'in-1', title: 'Private evenings', caption: 'The table, laid', body: \"Small gatherings of collectors and the artists we believe in most. No stage. No pitch.\" },\n      { id: 'in-2', title: 'First viewings', caption: 'A canvas, seen close', body: \"See the work before it reaches a fair or a feed. Quietly, and first.\" },\n      { id: 'in-3', title: 'Direct introductions', caption: 'A handshake, unposed', body: \"Meet the artist, not the gallery wall. Introductions made by hand, on purpose.\" },\n      { id: 'in-4', title: 'The room', caption: 'The circle, gathered', body: \"A standing circle of serious collectors. The connections compound with every evening.\" },\n    ];\n    const logos = Array.from({ length: 5 }, (_, i) => ({ id: 'logo-' + (i + 1), caption: 'Logo' }));\n    const roomPhotos = [      { id: 'room-1', caption: 'The room, filling' },\n      { id: 'room-2', caption: 'An artist, mid-sentence' },\n      { id: 'room-3', caption: 'Work, seen close' },\n      { id: 'room-4', caption: 'Candlelight, late' },\n    ];\n    const cities = ['', '', '', 'Limited Founding Circle', 'Now Forming', '', '', ''];\n    return {\n      stats, roomPhotos, values, inside, formUrl, cities, logos,\n      showInside: p.showInside ?? false,\n      showRoom: p.showRoom ?? false,\n      showFaq: p.showFaq ?? false,\n      navLinks: [\n        { id: 'idea', label: 'The Idea' },\n        { id: 'evening', label: 'The Evening' },\n        ...(p.showFaq ?? false ? [{ id: 'faq', label: 'FAQ' }] : []),\n        { id: 'request', label: 'For Artists & Galleries' },\n      ],\n      onNavigate: (id) => this.scrollTo(id === 'home' ? 'hero' : id),\n      navStyle: { border: 'none' },\n      navButton: NS.Button ? React.createElement(NS.Button, { size: 'sm', onClick: toForm }, 'Become a Founding Member') : null,\n      cardButton: NS.Button ? React.createElement(NS.Button, { onClick: toForm }, 'Become a Founding Member') : null,\n      toForm,\n      faq: faqData.map(([question, answer], i) => {\n        const open = single ? s.open === i : !!(s['o' + i]);\n        return {\n          question, answer, open, sign: open ? '\\u2212' : '+',\n          toggle: () => single\n            ? this.setState({ open: s.open === i ? -1 : i })\n            : this.setState({ ['o' + i]: !s['o' + i] }),\n        };\n      }),\n      sent: s.sent,\n      notSent: !s.sent,\n      name: s.name, email: s.email, who: s.who, brings: s.brings, note: s.note,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setEmail: (e) => this.setState({ email: e.target.value }),\n      setWho: (e) => this.setState({ who: e.target.value }),\n      setBrings: (e) => this.setState({ brings: e.target.value }),\n      setNote: (e) => this.setState({ note: e.target.value }),\n      nameError: t && !s.name.trim() ? 'Required.' : undefined,\n      emailError: t && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.email.trim()) ? 'A working email, please.' : undefined,\n      whoError: !!(t && !s.who),\n      bringsError: !!(t && !s.brings),\n      whoOptions: [\n        { value: '', label: 'Select one' },\n        { value: 'Collector', label: 'Collector' },\n        { value: 'Artist', label: 'Artist' },\n        { value: 'Gallery or dealer', label: 'Gallery or dealer' },\n        { value: 'Something else', label: 'Something else' },\n      ],\n      bringsOptions: [\n        { value: '', label: 'Select one' },\n        { value: 'Meeting artists early', label: 'Meeting artists early' },\n        { value: 'Getting my work in front of collectors', label: 'Getting my work in front of collectors' },\n        { value: 'Introducing my gallery', label: 'Introducing my gallery' },\n        { value: 'Seeing what this is', label: 'Seeing what this is' },\n      ],\n      submit: () => this.submit(),\n      footerColumns: [\n        { label: 'The circle', lines: ['The Idea', 'The Evening', 'Founding members'] },\n        { label: 'More', lines: ['FAQ', 'For artists & galleries', 'info@jointartifice.art'] },\n      ],\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
